<!doctype html>
<html>
  <head>
    <title>CGPA Prediction Tool</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
      body {
        font-family: Arial;
        background: #f4f6f9;
        text-align: center;
        padding: 40px;
      }

      .container {
        width: 600px;
        margin: auto;
        background: white;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }

      table {
        margin: auto;
        margin-top: 20px;
      }

      input {
        padding: 6px;
        margin: 5px;
        width: 80px;
      }

      button {
        padding: 10px 18px;
        margin-top: 15px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }

      button:hover {
        background: #0056b3;
      }

      #result {
        font-size: 20px;
        margin-top: 20px;
        color: #2c3e50;
      }

      canvas {
        margin-top: 30px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>CGPA Prediction Tool</h2>

      <p>Enter your semester CGPA</p>

      <table id="cgpaTable">
        <tr>
          <th>Semester</th>
          <th>CGPA</th>
        </tr>

        <tr>
          <td><input type="number" value="1" /></td>
          <td><input type="number" step="0.01" /></td>
        </tr>

        <tr>
          <td><input type="number" value="2" /></td>
          <td><input type="number" step="0.01" /></td>
        </tr>

        <tr>
          <td><input type="number" value="3" /></td>
          <td><input type="number" step="0.01" /></td>
        </tr>

        <tr>
          <td><input type="number" value="4" /></td>
          <td><input type="number" step="0.01" /></td>
        </tr>
      </table>
      <button onclick="addRow()">Add Semester</button>

      <br />

      Predict CGPA at Semester:
      <input type="number" id="predictX" />

      <br />

      <button onclick="predictCGPA()">Predict CGPA</button>

      <div id="result"></div>
      <div id="result"></div>
      <div id="confidence"></div>

      <canvas id="cgpaChart"></canvas>
    </div>

    <script src="script.js"></script>
  </body>
</html>
